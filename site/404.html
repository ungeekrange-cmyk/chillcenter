<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #fff7eb; color: #342523; line-height: 1.6; }

    main { max-width: 800px; padding: 3rem 1.5rem; margin: auto; }
    .eyebrow { color: #833b39; font-weight: 700; }
    h1 { font: 500 clamp(2rem, 6vw, 3rem)/1.1 Georgia, serif; }
    a { display: inline-block; background: #833b39; color: #fff9ef; border-radius: 99px; padding: .85rem 1.3rem; font-weight: 700; }
    a:focus-visible { outline: 3px solid #004e83; outline-offset: 5px; }
    @media (prefers-color-scheme: dark) {
      :root { background: #211c1b; color: #f6e9d9; }
      .eyebrow { color: #edb390; }
      a { background: #edb390; color: #36211c; }
      a:focus-visible { outline-color: #8fd0ff; }

</head>
