<div id="chill-sidebar-events">
<style>
#chill-sidebar-events{font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;width:100%;color-scheme:light dark}
#chill-sidebar-events *{box-sizing:border-box}
#chill-sidebar-events .cc-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;padding-right:95px}
#chill-sidebar-events .cc-toolbar button{font:inherit;border:1px solid light-dark(#c8c1b5,#5c6058);background:light-dark(#f5f1e8,#242b26);color:light-dark(#38382f,#efece0);padding:8px 14px;border-radius:8px}
#chill-sidebar-events .cc-toolbar button[aria-pressed=true]{background:light-dark(#683338,#d8c48c);color:light-dark(#fff8e8,#20241c)}
#chill-sidebar-events .cc-toolbar label{font-size:12px;display:flex;align-items:center;gap:7px;color:light-dark(#4c5047,#d4d8cf)}
#chill-sidebar-events .cc-samples{display:grid;grid-template-columns:repeat(2,minmax(0,242px));justify-content:center;gap:28px}
#chill-sidebar-events .cc-sample>h3{margin:0 0 9px;font-size:14px;font-weight:500;color:light-dark(#383c34,#e9eadf)}
#chill-sidebar-events .cc-panel{--cc-side:#17201c;--cc-ink:#f0eee4;--cc-muted:#bcbfb1;--cc-accent:#d9c48b;--cc-selected:#d9c48b20;background:var(--cc-side);color:var(--cc-ink);border-radius:14px;position:relative;isolation:isolate;overflow:hidden;min-height:560px;display:flex;padding:24px 14px 16px}
#chill-sidebar-events .cc-panel.cc-halloween{--cc-side:#352014;--cc-ink:#fff1df;--cc-muted:#dcc0a4;--cc-accent:#ffae58;--cc-selected:#ffae581c}
#chill-sidebar-events[data-mode=light] .cc-panel{--cc-side:#eeeade;--cc-ink:#302c25;--cc-muted:#686355;--cc-accent:#795428;--cc-selected:#79542818}
#chill-sidebar-events[data-mode=light] .cc-panel.cc-halloween{--cc-side:#f5d4a7;--cc-ink:#432917;--cc-muted:#6f492b;--cc-accent:#8b3b0e;--cc-selected:#b64f1d25}
#chill-sidebar-events .cc-panel:not(.cc-halloween){--cc-side:#701019;--cc-ink:#fff5e7;--cc-muted:#efd3bb;--cc-accent:#e8ca8b;--cc-selected:#e8ca8b20}
#chill-sidebar-events[data-mode=light] .cc-panel:not(.cc-halloween){--cc-side:#ba3028;--cc-ink:#fff8ed;--cc-muted:#fff0df;--cc-accent:#ffe0a3;--cc-selected:#ffe0a318}
#chill-sidebar-events .cc-content{position:relative;z-index:2;display:flex;flex-direction:column;flex:1;min-width:0}
#chill-sidebar-events .cc-logo{display:block;width:82px;height:82px;border-radius:20px;margin:0 auto 27px}
#chill-sidebar-events .cc-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--cc-muted);margin:0 12px 12px}
#chill-sidebar-events .cc-menu{display:grid;gap:5px}
#chill-sidebar-events .cc-menu>div,#chill-sidebar-events .cc-bottom>div{padding:11px 12px;color:var(--cc-muted);border-radius:8px;font-size:13px;display:flex;gap:12px;align-items:center}
#chill-sidebar-events .cc-menu .cc-active{background:var(--cc-selected);color:var(--cc-ink);font-weight:600}
#chill-sidebar-events .cc-menu span,#chill-sidebar-events .cc-bottom span{color:var(--cc-accent);width:17px;flex:none}
#chill-sidebar-events .cc-bottom{margin-top:auto;padding-top:45px}
#chill-sidebar-events .cc-weather{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#chill-sidebar-events .cc-snow i{position:absolute;left:var(--x);top:-9px;width:var(--size);height:var(--size);border-radius:50%;background:#fff9e9;opacity:.6;animation:cc-sidebar-snow var(--duration) linear var(--delay) infinite}
#chill-sidebar-events[data-mode=light] .cc-snow i{background:#fff;box-shadow:0 0 2px #70807180}
#chill-sidebar-events .cc-bats i{position:absolute;left:var(--x);bottom:-20px;width:28px;height:17px;animation:cc-sidebar-flight var(--duration) linear var(--delay) infinite;opacity:.45}
#chill-sidebar-events .cc-bats i span{display:block;width:100%;height:100%;background:#c0adbd;clip-path:polygon(0 0,25% 20%,35% 48%,43% 16%,50% 30%,58% 16%,65% 48%,75% 20%,100% 0,90% 55%,75% 48%,64% 83%,50% 100%,36% 83%,25% 48%,10% 55%);animation:cc-sidebar-flap .65s ease-in-out infinite alternate}
#chill-sidebar-events[data-mode=light] .cc-bats i span{background:#765265}
#chill-sidebar-events[data-animation=false] .cc-weather{display:none}
#chill-sidebar-events[data-hidden=true] .cc-weather *,#chill-sidebar-events[data-inview=false] .cc-weather *{animation-play-state:paused}
@keyframes cc-sidebar-snow{0%{transform:translate(0,-10px);opacity:0}7%{opacity:.6}90%{opacity:.55}100%{transform:translate(26px,610px);opacity:0}}
@keyframes cc-sidebar-flight{0%{transform:translate(-8px,0) rotate(-8deg) scale(.75);opacity:0}8%{opacity:.45}40%{transform:translate(18px,-240px) rotate(9deg) scale(.85)}70%{transform:translate(-12px,-420px) rotate(-9deg) scale(.65);opacity:.4}100%{transform:translate(14px,-610px) rotate(5deg) scale(.5);opacity:0}}
@keyframes cc-sidebar-flap{from{transform:scaleY(.55)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){#chill-sidebar-events .cc-weather{display:none}}
@media(max-width:590px){#chill-sidebar-events .cc-samples{grid-template-columns:minmax(0,260px);gap:20px}#chill-sidebar-events .cc-toolbar{padding-right:0}#chill-sidebar-events .cc-toolbar button{min-height:44px}}
</style>
