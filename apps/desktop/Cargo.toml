[package]
name = "chillcenter-desktop"
version = "0.5.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
chill-catalog.workspace = true
chill-client.workspace = true
chill-domain.workspace = true
chill-player.workspace = true
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSOpenGL", "NSView"] }
objc2-foundation = "0.3.2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
tauri = { version = "2.12", features = ["custom-protocol"] }
tauri-plugin-dialog = { version = "2.8.2", default-features = false }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"
