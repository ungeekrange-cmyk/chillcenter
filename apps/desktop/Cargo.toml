[package]
name = "chillcenter-desktop"
version = "0.7.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
chill-catalog.workspace = true
chill-client.workspace = true
chill-domain.workspace = true
chill-player.workspace = true
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSOpenGL", "NSView"] }
objc2-foundation = "0.3.2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tokio.workspace = true
tauri = { version = "2.12", features = ["custom-protocol"] }
tauri-plugin-dialog = { version = "2.8.2", default-features = false }
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "zip"] }
base64 = "0.22"
sha2 = "0.10"
chill-updates.workspace = true
semver = "=1.0.28"
time = { version = "=0.3.55", features = ["local-offset"] }

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3"
