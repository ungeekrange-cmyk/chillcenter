[workspace]
members = ["crates/chill-catalog", "crates/chill-domain", "crates/chill-server", "crates/chill-client", "crates/chill-player", "apps/desktop"]
exclude = ["native/macos-render-probe"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "net", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "blocking", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "backup", "hooks"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
chill-catalog = { path = "crates/chill-catalog" }
chill-domain = { path = "crates/chill-domain" }
chill-client = { path = "crates/chill-client" }
chill-player = { path = "crates/chill-player" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
